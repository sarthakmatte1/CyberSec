<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruitment Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: #04102a;
    font-family: 'DM Sans', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .rp-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(55,138,221,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(55,138,221,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .rp-glow {
    position: fixed;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(24,95,165,0.22) 0%, transparent 70%);
    top: -120px;
    right: -100px;
    pointer-events: none;
  }

  .rp-glow2 {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(15,110,86,0.18) 0%, transparent 70%);
    bottom: -80px;
    left: -80px;
    pointer-events: none;
  }

  .rp-card {
    position: relative;
    background: rgba(10,24,54,0.85);
    border: 1px solid rgba(55,138,221,0.2);
    border-radius: 20px;
    padding: 3rem 2.5rem 2.5rem;
    width: 100%;
    max-width: 420px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 0 80px rgba(24,95,165,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .rp-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(15,110,86,0.15);
    border: 1px solid rgba(29,158,117,0.3);
    border-radius: 100px;
    padding: 5px 14px;
    margin-bottom: 1.75rem;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: #5DCAA5;
    text-transform: uppercase;
  }

  .rp-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #1D9E75;
    animation: rp-pulse 2s ease-in-out infinite;
  }

  @keyframes rp-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.8); }
  }

  .rp-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 0.5rem;
  }

  .rp-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #185FA5, #378ADD);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .rp-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 28px;
    color: #e8f0fe;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .rp-sub {
    font-size: 13.5px;
    color: rgba(180,195,230,0.65);
    margin: 1rem 0 2rem;
    line-height: 1.6;
    font-weight: 300;
    letter-spacing: 0.01em;
  }

  .rp-divider {
    height: 1px;
    background: rgba(55,138,221,0.12);
    margin-bottom: 1.75rem;
  }

  .rp-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    letter-spacing: 0.01em;
    margin-bottom: 12px;
  }

  .rp-btn-primary {
    background: linear-gradient(135deg, #185FA5, #378ADD);
    color: #ffffff;
    box-shadow: 0 4px 20px rgba(24,95,165,0.4);
  }

  .rp-btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 28px rgba(24,95,165,0.55);
  }

  .rp-btn-secondary {
    background: rgba(29,158,117,0.1);
    color: #5DCAA5;
    border: 1px solid rgba(29,158,117,0.3);
  }

  .rp-btn-secondary:hover {
    background: rgba(29,158,117,0.18);
    border-color: rgba(29,158,117,0.5);
    transform: translateY(-1px);
  }

  .rp-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid rgba(55,138,221,0.1);
  }

  .rp-footer-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: rgba(150,170,210,0.5);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 400;
  }

  .rp-sep {
    color: rgba(55,138,221,0.2);
    font-size: 14px;
  }
</style>
</head>
<body>

  <div class="rp-grid"></div>
  <div class="rp-glow"></div>
  <div class="rp-glow2"></div>

  <div class="rp-card">

    <div class="rp-badge">
      <span class="rp-dot"></span>
      System Active
    </div>

    <div class="rp-logo">
      <div class="rp-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z"
                fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M9 12l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="rp-title">Recruitment<br>Portal</h1>
    </div>

    <p class="rp-sub">Secure online hiring &amp; candidate management system — encrypted, audited, compliant.</p>

    <div class="rp-divider"></div>

    <a href="/login" class="rp-btn rp-btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="4" stroke="white" stroke-width="1.5"/>
        <path d="M5 20c0-3.31 3.13-6 7-6s7 2.69 7 6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Sign In to Portal
    </a>

    <a href="/register" class="rp-btn rp-btn-secondary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Create an Account
    </a>

    <div class="rp-footer">
      <span class="rp-footer-item">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
        </svg>
        256-bit SSL
      </span>
      <span class="rp-sep">|</span>
      <span class="rp-footer-item">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
          <path d="M9 12l2 2 4-4M12 3l7 3v5c0 4.5-3 8.5-7 10C8 19.5 5 15.5 5 11V6l7-3z"
                stroke="currentColor" stroke-width="2"/>
        </svg>
        GDPR Compliant
      </span>
      <span class="rp-sep">|</span>
      <span class="rp-footer-item">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M12 8v4l2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        24/7 Monitored
      </span>
    </div>

  </div>

</body>
</html>
