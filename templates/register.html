<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Recruitment Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: #04102a;
    font-family: 'DM Sans', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .rp-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(55,138,221,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(55,138,221,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .rp-glow {
    position: fixed;
    width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(24,95,165,0.22) 0%, transparent 70%);
    top: -120px; right: -100px; pointer-events: none;
  }

  .rp-glow2 {
    position: fixed;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(15,110,86,0.18) 0%, transparent 70%);
    bottom: -80px; left: -80px; pointer-events: none;
  }

  .rp-card {
    position: relative;
    background: rgba(10,24,54,0.88);
    border: 1px solid rgba(55,138,221,0.2);
    border-radius: 20px;
    padding: 2.75rem 2.5rem 2.25rem;
    width: 100%;
    max-width: 460px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 0 80px rgba(24,95,165,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .rp-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 0.4rem;
  }

  .rp-icon {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, #185FA5, #378ADD);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .rp-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 26px; color: #e8f0fe; letter-spacing: -0.01em;
  }

  .rp-sub {
    font-size: 13px; color: rgba(180,195,230,0.55);
    margin-bottom: 1.75rem; font-weight: 300; letter-spacing: 0.01em;
  }

  .rp-divider {
    height: 1px; background: rgba(55,138,221,0.12); margin-bottom: 1.5rem;
  }

  /* ── Flash ── */
  .flash {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: 10px;
    font-size: 13.5px; margin-bottom: 1rem;
    background: rgba(162,45,45,0.15);
    border: 1px solid rgba(224,75,74,0.3);
    color: #F09595;
  }

  /* ── Fields ── */
  .rp-field { margin-bottom: 1.1rem; }

  label {
    display: block; font-size: 12px; font-weight: 500;
    color: rgba(180,200,240,0.65); letter-spacing: 0.06em;
    text-transform: uppercase; margin-bottom: 7px;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%; padding: 12px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(55,138,221,0.2);
    border-radius: 10px; font-size: 14.5px;
    font-family: 'DM Sans', sans-serif; color: #e8f0fe;
    transition: border-color 0.2s, background 0.2s; outline: none;
  }

  input::placeholder { color: rgba(150,175,220,0.3); }

  input:focus {
    border-color: rgba(55,138,221,0.55);
    background: rgba(55,138,221,0.06);
  }

  /* ── Password strength ── */
  .strength-bar-wrap { display: flex; gap: 5px; margin-top: 8px; margin-bottom: 4px; }

  .strength-seg {
    height: 3px; flex: 1; border-radius: 99px;
    background: rgba(255,255,255,0.07); transition: background 0.3s;
  }

  .strength-label {
    font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
    color: rgba(150,175,220,0.4); transition: color 0.3s; min-height: 16px;
  }

  /* ── Role select — only 2 options now ── */
  .role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

  .role-option { position: relative; }

  .role-option input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }

  .role-option label {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 13px 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(55,138,221,0.18);
    border-radius: 11px; cursor: pointer;
    font-size: 12px; font-weight: 500; color: rgba(160,185,230,0.55);
    letter-spacing: 0.04em; text-transform: uppercase;
    transition: all 0.2s; text-align: center;
  }

  .role-option label svg { opacity: 0.5; transition: opacity 0.2s; }

  .role-option input[type="radio"]:checked + label {
    background: rgba(24,95,165,0.18);
    border-color: rgba(55,138,221,0.55);
    color: #85B7EB;
    box-shadow: 0 0 0 1px rgba(55,138,221,0.3);
  }

  .role-option input[type="radio"]:checked + label svg { opacity: 1; }

  .role-option label:hover {
    background: rgba(55,138,221,0.08);
    border-color: rgba(55,138,221,0.35);
    color: rgba(180,210,240,0.75);
  }

  /* ── Submit ── */
  .rp-btn {
    width: 100%; padding: 13px 20px;
    background: linear-gradient(135deg, #185FA5, #378ADD);
    color: #fff; border: none; border-radius: 11px;
    font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-top: 1.5rem;
    box-shadow: 0 4px 20px rgba(24,95,165,0.4);
    transition: transform 0.2s, box-shadow 0.2s; letter-spacing: 0.01em;
  }

  .rp-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(24,95,165,0.55); }

  .rp-links {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-top: 1.5rem; padding-top: 1.25rem;
    border-top: 1px solid rgba(55,138,221,0.1);
  }

  .rp-links a {
    font-size: 13px; color: rgba(133,183,235,0.65);
    text-decoration: none; transition: color 0.2s;
  }

  .rp-links a:hover { color: #85B7EB; }
</style>
</head>
<body>

  <div class="rp-grid"></div>
  <div class="rp-glow"></div>
  <div class="rp-glow2"></div>

  <div class="rp-card">

    <div class="rp-header">
      <div class="rp-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z"
                fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M9 12l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="rp-title">Create Account</h1>
    </div>

    <p class="rp-sub">Join the Secure Recruitment Portal</p>

    <div class="rp-divider"></div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
              <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- FIX 1: explicit action="/register", FIX 2: csrf_token() added -->
    <form method="POST" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="rp-field">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" name="name" placeholder="Jane Smith" required maxlength="100">
      </div>

      <div class="rp-field">
        <label for="reg-email">Email Address</label>
        <!-- type="text" to avoid browser auto-validation conflicting with server regex -->
        <input type="text" id="reg-email" name="email" placeholder="you@example.com" required maxlength="254">
      </div>

      <div class="rp-field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" name="password"
               placeholder="Min 8 chars, upper, lower, number, symbol"
               required onkeyup="checkStrength()">
        <div class="strength-bar-wrap">
          <div class="strength-seg" id="seg1"></div>
          <div class="strength-seg" id="seg2"></div>
          <div class="strength-seg" id="seg3"></div>
          <div class="strength-seg" id="seg4"></div>
        </div>
        <div class="strength-label" id="strength-label"></div>
      </div>

      <!-- FIX 3: Admin option removed — server blocks it, but it should not be shown -->
      <div class="rp-field">
        <label>Account Type</label>
        <div class="role-grid">

          <div class="role-option">
            <input type="radio" name="role" id="role-candidate" value="candidate" required>
            <label for="role-candidate">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
                <path d="M5 20c0-3.31 3.13-6 7-6s7 2.69 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              Candidate
            </label>
          </div>

          <div class="role-option">
            <input type="radio" name="role" id="role-employer" value="employer">
            <label for="role-employer">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="7" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                <path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2" stroke="currentColor" stroke-width="1.5"/>
                <path d="M12 12v4M10 14h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              Employer
            </label>
          </div>

        </div>
      </div>

      <button type="submit" class="rp-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Create Account
      </button>

    </form>

    <div class="rp-links">
      <a href="/login">Already have an account? Sign in</a>
    </div>

  </div>

<script>
function checkStrength() {
  const pass = document.getElementById("reg-password").value;
  const label = document.getElementById("strength-label");
  const segs = [
    document.getElementById("seg1"),
    document.getElementById("seg2"),
    document.getElementById("seg3"),
    document.getElementById("seg4")
  ];

  let score = 0;
  if (pass.length >= 8)                    score++;
  if (/[A-Z]/.test(pass))                  score++;
  if (/[0-9]/.test(pass))                  score++;
  if (/[!@#$%^&*()_+=\-]/.test(pass))     score++;  // matches server-side strong_password()

  const colors      = ["#E24B4A", "#E24B4A", "#EF9F27", "#1D9E75"];
  const labelText   = ["", "Weak", "Medium", "Strong"];
  const labelColors = ["rgba(150,175,220,0.4)", "#F09595", "#FAC775", "#5DCAA5"];

  segs.forEach((seg, i) => {
    seg.style.background = i < score
      ? colors[Math.min(score - 1, 3)]
      : "rgba(255,255,255,0.07)";
  });

  label.textContent = pass.length === 0 ? "" : labelText[score] + " Password";
  label.style.color = pass.length === 0 ? "rgba(150,175,220,0.4)" : labelColors[score];
}
</script>

</body>
</html>
