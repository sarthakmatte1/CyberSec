<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>429 – Too Many Requests</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #8b0000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 48px 40px;
      text-align: center;
      max-width: 480px;
      width: 90%;
    }
    .code { font-size: 64px; font-weight: bold; color: #cc0000; }
    .msg  { color: #444; margin: 16px 0 8px; font-size: 16px; }
    .sub  { color: #666; font-size: 14px; margin-bottom: 28px; }
    #countdown { font-weight: bold; color: #cc0000; }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      pointer-events: none;   /* disabled until cooldown ends */
      opacity: 0.5;
      transition: opacity 0.3s;
    }
    .btn.ready {
      pointer-events: auto;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">429</div>
    <p class="msg">Too many attempts detected.</p>
    <p class="sub">You can try again in <span id="countdown">60</span> seconds.</p>
    <a href="/login" class="btn" id="loginBtn">Back to Login</a>
  </div>

  <script nonce="{{ g.csp_nonce }}">
    const btn = document.getElementById('loginBtn');
    const cdEl = document.getElementById('countdown');
    let seconds = 60;

    const timer = setInterval(() => {
      seconds--;
      cdEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        cdEl.textContent = '0';
        btn.classList.add('ready');
        btn.closest('p.sub').innerHTML = 'You can try again now.';
      }
    }, 1000);
  </script>
</body>
</html>
