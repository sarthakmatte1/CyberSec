<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Blocked</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#7f1d1d,#991b1b);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:430px;
    background:white;
    padding:40px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,0.2);
}

h1{
    color:#dc2626;
    margin-top:0;
    font-size:34px;
}

p{
    color:#374151;
    font-size:16px;
    line-height:1.6;
}

a{
    display:inline-block;
    margin-top:20px;
    padding:12px 22px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>Access Blocked</h1>

<p>
Your IP has been temporarily blocked due to suspicious activity.<br>
Please try again later.
</p>

<a href="/login">Back</a>

</div>

</body>
</html>
